[package]
name = "cormier-realtime-example-rust-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.32"
rand = "0.9.2"
redis = { version = "1.7.0", features = ["aio", "connection-manager", "tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
url = "2.5.7"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
strip = true
