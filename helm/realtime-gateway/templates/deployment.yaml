apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "realtime-gateway.fullname" . }}
  labels:
    {{- include "realtime-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.deploymentStrategy.maxUnavailable }}
      maxSurge: {{ .Values.deploymentStrategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "realtime-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "realtime-gateway.selectorLabels" . | nindent 8 }}
        {{- if eq .Values.redis.mode "managed" }}
        {{ printf "%s-client" .Values.redis.managedReleaseName }}: "true"
        {{- end }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "realtime-gateway.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.zoneWhenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "realtime-gateway.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "realtime-gateway.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: {{ .Values.service.targetPort }}, protocol: TCP }
          envFrom:
            - configMapRef: { name: {{ include "realtime-gateway.fullname" . }} }
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ .Values.service.targetPort | quote }}
            - name: CORMIER_REALTIME_INSTANCE_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: Redis__Password
              valueFrom:
                secretKeyRef: { name: {{ .Values.redis.credentialsSecret.name }}, key: {{ .Values.redis.credentialsSecret.passwordKey }} }
            {{- if and (eq .Values.redis.mode "managed") (eq .Values.topology "ha") }}
            - name: Redis__SentinelPassword
              valueFrom:
                secretKeyRef: { name: {{ .Values.redis.credentialsSecret.name }}, key: {{ .Values.redis.managedAdminPasswordKey }} }
            {{- end }}
            - name: Redis__Ssl
              value: {{ .Values.redis.tls | quote }}
            {{- if and .Values.diagnostics.enabled .Values.diagnostics.operatorTokenSecret.name }}
            - name: Diagnostics__OperatorToken
              valueFrom:
                secretKeyRef: { name: {{ .Values.diagnostics.operatorTokenSecret.name }}, key: {{ .Values.diagnostics.operatorTokenSecret.key }} }
            {{- end }}
            {{- if and .Values.metrics.enabled .Values.metrics.authorizationPolicy .Values.metrics.scrapeTokenSecret.name }}
            - name: Metrics__ScrapeToken
              valueFrom:
                secretKeyRef: { name: {{ .Values.metrics.scrapeTokenSecret.name }}, key: {{ .Values.metrics.scrapeTokenSecret.key }} }
            {{- end }}
            {{- if and .Values.observability.otlp.enabled .Values.observability.otlp.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: { name: {{ .Values.observability.otlp.headersSecret.name }}, key: {{ .Values.observability.otlp.headersSecret.key }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
