<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cormier.Realtime full-circle test app</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>Cormier.Realtime full circle</h1>
    <p id="diagnostics">Loading topology…</p>
    <section>
      <h2>Session</h2>
      <label>Tenant <select id="tenant"><option>tenant-a</option><option>tenant-b</option></select></label>
      <label>User <select id="user"><option>user-a</option><option>user-b</option></select></label>
      <button id="login">Log in</button><button id="logout">Log out</button>
    </section>
    <section>
      <h2>Realtime</h2>
      <p>State: <strong id="state">idle</strong></p>
      <label>Route <input id="route" value="topics/orders"></label>
      <label>Payload <input id="payload" value='{"message":"hello"}'></label>
      <button id="connect">Connect</button><button id="disconnect">Disconnect</button>
      <button id="subscribe">Subscribe</button><button id="unsubscribe">Unsubscribe</button>
      <button id="publish">Publish</button>
    </section>
    <section><h2>Events and diagnostics</h2><pre id="events" aria-live="polite"></pre></section>
    <p><a href="/esm.html">Run the ESM variant</a></p>
    <p><a href="/operator.html">Open the operator diagnostics workflow</a></p>
  </main>
  <script src="/_content/Cormier.Realtime.Browser/cormier-realtime.iife.js"></script>
  <script src="/app.js"></script>
</body>
</html>
