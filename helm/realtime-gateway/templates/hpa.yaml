{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "realtime-gateway.fullname" . }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "realtime-gateway.fullname" . }} }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }} }
    {{- if .Values.autoscaling.connectionsMetric.enabled }}
    - type: Pods
      pods:
        metric: { name: cormier_realtime_active_connections }
        target: { type: AverageValue, averageValue: {{ .Values.autoscaling.connectionsMetric.targetAverageValue | quote }} }
    {{- end }}
    {{- if .Values.autoscaling.queueDepthMetric.enabled }}
    - type: Pods
      pods:
        metric: { name: cormier_realtime_queue_depth }
        target: { type: AverageValue, averageValue: {{ .Values.autoscaling.queueDepthMetric.targetAverageValue | quote }} }
    {{- end }}
{{- end }}
