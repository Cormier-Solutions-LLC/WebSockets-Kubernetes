# Base values for the verified and locally patched bitnamicharts/redis 23.1.1.
# Environment-specific image coordinates and digests are rendered by the bootstrap.
global:
  security:
    # Required only when a reviewed mirror such as bitnamilegacy is configured.
    allowInsecureImages: true
architecture: replication
image:
  registry: docker.io
  repository: bitnamilegacy/redis
  tag: 8.2.1-debian-12-r0
  digest: sha256:25bf63f3caf75af4628c0dfcf39859ad1ac8abe135be85e99699f9637b16dc28
auth:
  enabled: true
  sentinel: true
  existingSecret: cormier-redis-auth
  existingSecretPasswordKey: redis-password
  acl:
    enabled: true
    sentinel: false
    userSecret: cormier-redis-auth
    users:
      - username: realtime
        enabled: "on"
        commands: "+@read +@write +@connection +@pubsub +@scripting +@stream"
        keys: "~cormier:realtime:*"
        channels: "&cormier:realtime:*"
tls: { enabled: false }
master:
  persistence: { enabled: true, size: 8Gi }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  pdb: { create: true, minAvailable: 1 }
  topologySpreadConstraints:
    - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway }
replica:
  replicaCount: 3
  # Start one member at a time. The patched Service publishes its endpoint before
  # readiness so Redis and Sentinel can discover the first member during bootstrap.
  podManagementPolicy: OrderedReady
  dnsConfig:
    options:
      - { name: timeout, value: "2" }
      - { name: attempts, value: "3" }
      - { name: single-request-reopen }
  startupProbe: { enabled: true, failureThreshold: 60 }
  persistence: { enabled: true, size: 8Gi }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  podAntiAffinityPreset: soft
  pdb: { create: true, minAvailable: 2 }
sentinel:
  enabled: true
  quorum: 2
  image:
    registry: docker.io
    repository: bitnamilegacy/redis-sentinel
    tag: 8.2.1-debian-12-r0
    digest: sha256:0ca3ea1d2f823c2d9265e0d9e682dc435f219f8d3385aed75b5bb0f365f516a9
  startupProbe: { enabled: true, failureThreshold: 60 }
  # Reapply the reviewed TILT tolerance after every Sentinel container start.
  # The probe authenticates as the default/admin user; it never prints the value.
  customStartupProbe:
    exec:
      command:
        - /bin/bash
        - -ec
        - |-
          export REDISCLI_AUTH="$(< "$REDIS_PASSWORD_FILE")"
          redis-cli -h 127.0.0.1 -p 26379 PING >/dev/null
          redis-cli -h 127.0.0.1 -p 26379 SENTINEL DEBUG tilt-trigger 10000 >/dev/null
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 60
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
metrics:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis-exporter
    tag: 1.76.0-debian-12-r0
    digest: sha256:d111b8a14d96f7edd67324776d6801b76023035d9390d03fbb13d1c21bda8b88
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
networkPolicy:
  enabled: true
  allowExternal: false
  allowExternalEgress: false
commonConfiguration: |-
  appendonly yes
  appendfsync everysec
  maxmemory-policy noeviction
