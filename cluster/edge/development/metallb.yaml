apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: development-traefik
  namespace: metallb-system
  labels:
    cormier.io/environment: development
spec:
  addresses:
    # Documentation-only example. Replace with a reserved range routable in the target environment.
    - 192.0.2.240-192.0.2.250
  autoAssign: false
  serviceAllocation:
    namespaces:
      - traefik
    serviceSelectors:
      - matchLabels:
          app.kubernetes.io/name: traefik
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: development-traefik
  namespace: metallb-system
  labels:
    cormier.io/environment: development
spec:
  ipAddressPools:
    - development-traefik
