name: Realtime gateway CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev
      - name: Restore locked dependencies
        run: dotnet restore Propago.Realtime.sln --runtime linux-x64 --locked-mode
      - name: Build
        run: dotnet build Propago.Realtime.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Propago.Realtime.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Native AOT publish
        run: dotnet publish src/Propago.Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore --output artifacts/native
      - name: Smoke-test Native AOT executable
        env:
          ASPNETCORE_URLS: http://127.0.0.1:8080
          Gateway__ShutdownDrainSeconds: '1'
        run: |
          artifacts/native/Propago.Realtime.Gateway > artifacts/native-smoke.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat artifacts/native-smoke.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/health/startup >/dev/null
          curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:8080/metrics | grep --quiet propago_realtime_health_requests_total
      - name: Create OCI archive with .NET SDK
        run: dotnet publish src/Propago.Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore /t:PublishContainer /p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/propago-realtime-gateway.tar.gz
      - name: Scan source and artifacts
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: artifacts/trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan deployable OCI archive
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: artifacts/propago-realtime-gateway.tar.gz
          format: sarif
          output: artifacts/trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true
      - name: Upload filesystem scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-filesystem.sarif
          category: trivy-filesystem
      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-image.sarif
          category: trivy-image
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts/native
          artifact-name: propago-realtime-gateway-sbom.spdx.json
          format: spdx-json
      - name: Upload immutable build evidence
        uses: actions/upload-artifact@v4
        with:
          name: propago-realtime-${{ github.sha }}
          path: |
            artifacts/native
            artifacts/propago-realtime-gateway.tar.gz
            artifacts/test-results
            artifacts/trivy-filesystem.sarif
            artifacts/trivy-image.sarif
            artifacts/native-smoke.log

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
