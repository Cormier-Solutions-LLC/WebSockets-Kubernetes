name: Publish immutable gateway image

on:
  workflow_run:
    workflows: [Realtime gateway CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  packages: write

env:
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
  REGISTRY_CREDENTIAL_PROVIDER: ${{ vars.REGISTRY_CREDENTIAL_PROVIDER }}
  CI_NODE_DOWNLOAD_MIRROR: ${{ vars.CI_NODE_DOWNLOAD_MIRROR || 'https://nodejs.org/dist' }}
  CI_GH_VERSION: ${{ vars.CI_GH_VERSION || '2.101.0' }}
  CI_GH_LINUX_AMD64_SHA256: ${{ vars.CI_GH_LINUX_AMD64_SHA256 || '9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8' }}
  CI_GH_DOWNLOAD_BASE_URL: ${{ vars.CI_GH_DOWNLOAD_BASE_URL || 'https://github.com/cli/cli/releases/download' }}
  CI_HELM_VERSION: ${{ vars.CI_HELM_VERSION || '3.22.0' }}
  CI_HELM_LINUX_AMD64_SHA256: ${{ vars.CI_HELM_LINUX_AMD64_SHA256 || '1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb' }}
  CI_HELM_DOWNLOAD_BASE_URL: ${{ vars.CI_HELM_DOWNLOAD_BASE_URL || 'https://get.helm.sh' }}
  CI_KUBECTL_VERSION: ${{ vars.CI_KUBECTL_VERSION || '1.37.1' }}
  CI_KUBECTL_LINUX_AMD64_SHA256: ${{ vars.CI_KUBECTL_LINUX_AMD64_SHA256 || '65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8' }}
  CI_KUBECTL_DOWNLOAD_BASE_URL: ${{ vars.CI_KUBECTL_DOWNLOAD_BASE_URL || 'https://dl.k8s.io/release' }}

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: cormier-runners
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Node runtime prerequisites
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          mirror: ${{ env.CI_NODE_DOWNLOAD_MIRROR }}
      - name: Install pinned deployment tools
        run: bash scripts/setup-ci-deployment-tools.sh
      - uses: actions/download-artifact@v7
        with:
          name: cormier-realtime-${{ github.event.workflow_run.head_sha }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate configured image coordinates
        env:
          CREDENTIAL_REGISTRY: ${{ vars.REGISTRY_CREDENTIAL_PROVIDER == 'github' && vars.GHCR_PUBLISH_REGISTRY || vars.REGISTRY_CREDENTIAL_PROVIDER == 'harbor' && vars.HARBOR_PUBLISH_REGISTRY || vars.REGISTRY_CREDENTIAL_PROVIDER == 'dockerhub' && vars.DOCKERHUB_PUBLISH_REGISTRY || vars.REGISTRY_CREDENTIAL_PROVIDER == 'generic' && vars.GENERIC_PUBLISH_REGISTRY || '' }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_CREDENTIAL_PROVIDER == 'github' && github.actor || vars.REGISTRY_CREDENTIAL_PROVIDER == 'harbor' && secrets.HARBOR_PUBLISH_USERNAME || vars.REGISTRY_CREDENTIAL_PROVIDER == 'dockerhub' && secrets.DOCKERHUB_USERNAME || vars.REGISTRY_CREDENTIAL_PROVIDER == 'generic' && secrets.REGISTRY_USERNAME || '' }}
          REGISTRY_PASSWORD: ${{ vars.REGISTRY_CREDENTIAL_PROVIDER == 'github' && github.token || vars.REGISTRY_CREDENTIAL_PROVIDER == 'harbor' && secrets.HARBOR_PUBLISH_TOKEN || vars.REGISTRY_CREDENTIAL_PROVIDER == 'dockerhub' && secrets.DOCKERHUB_TOKEN || vars.REGISTRY_CREDENTIAL_PROVIDER == 'generic' && secrets.REGISTRY_PASSWORD || '' }}
        run: |
          test -n "$CONTAINER_REGISTRY"
          test -n "$IMAGE_REPOSITORY"
          printf '%s' "$REGISTRY_CREDENTIAL_PROVIDER" | grep --quiet --extended-regexp '^(github|harbor|dockerhub|generic)$'
          test -n "$CREDENTIAL_REGISTRY"
          test "$CONTAINER_REGISTRY" = "$CREDENTIAL_REGISTRY"
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          printf '%s' "$CONTAINER_REGISTRY" | grep --quiet --extended-regexp '^[a-z0-9][a-z0-9.-]*(:[0-9]+)?$'
          printf '%s' "$IMAGE_REPOSITORY" | grep --quiet --extended-regexp '^[a-z0-9][a-z0-9._/-]*$'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ vars.REGISTRY_CREDENTIAL_PROVIDER == 'github' && github.actor || vars.REGISTRY_CREDENTIAL_PROVIDER == 'harbor' && secrets.HARBOR_PUBLISH_USERNAME || vars.REGISTRY_CREDENTIAL_PROVIDER == 'dockerhub' && secrets.DOCKERHUB_USERNAME || vars.REGISTRY_CREDENTIAL_PROVIDER == 'generic' && secrets.REGISTRY_USERNAME || '' }}
          password: ${{ vars.REGISTRY_CREDENTIAL_PROVIDER == 'github' && github.token || vars.REGISTRY_CREDENTIAL_PROVIDER == 'harbor' && secrets.HARBOR_PUBLISH_TOKEN || vars.REGISTRY_CREDENTIAL_PROVIDER == 'dockerhub' && secrets.DOCKERHUB_TOKEN || vars.REGISTRY_CREDENTIAL_PROVIDER == 'generic' && secrets.REGISTRY_PASSWORD || '' }}
      - name: Push the tested OCI archive without rebuilding
        id: publish
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          load_output=$(docker load --input artifacts/cormier-realtime-gateway.tar.gz)
          source_ref=$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image: //p' | tail -n 1)
          test -n "$source_ref"
          normalized_repository=$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          target_ref="${CONTAINER_REGISTRY}/${normalized_repository}:${SOURCE_SHA}"
          release_version=$(sed -n "s/.*<ApplicationVersion[^>]*>\([^<]*\)<\/ApplicationVersion>.*/\1/p" Directory.Build.props)
          container_version=$(sed -n "s/.*<ContainerVersion[^>]*>\([^<]*\)<\/ContainerVersion>.*/\1/p" Directory.Build.props)
          chart_version=$(sed -n 's/^version: //p' helm/realtime-gateway/Chart.yaml)
          chart_app_version=$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' helm/realtime-gateway/Chart.yaml)
          npm_version=$(node -p "require('./sdk/typescript/package.json').version")
          test -n "$release_version"
          printf '%s' "$release_version" | grep --quiet --extended-regexp '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          test "$container_version" = "$release_version"
          test "$chart_version" = "$release_version"
          test "$chart_app_version" = "$release_version"
          test "$npm_version" = "$release_version"
          previous_version=$(git show "${SOURCE_SHA}^:Directory.Build.props" | sed -n "s/.*<ApplicationVersion[^>]*>\([^<]*\)<\/ApplicationVersion>.*/\1/p")
          is_release=false
          if [ "$previous_version" != "$release_version" ]; then
            is_release=true
          fi
          docker tag "$source_ref" "$target_ref"
          docker push "$target_ref"
          if [ "$is_release" = 'true' ]; then
            release_ref="${CONTAINER_REGISTRY}/${normalized_repository}:${release_version}"
            docker tag "$source_ref" "$release_ref"
            docker push "$release_ref"
          fi
          digest=$(docker buildx imagetools inspect "$target_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$digest"
          archive_sha=$(sha256sum artifacts/cormier-realtime-gateway.tar.gz | cut -d' ' -f1)
          printf '{"schemaVersion":3,"releaseVersion":"%s","versionRelease":%s,"sourceCommit":"%s","image":"%s","credentialProvider":"%s","digest":"%s","archiveSha256":"%s","ciRunId":%s}\n' "$release_version" "$is_release" "$SOURCE_SHA" "${CONTAINER_REGISTRY}/${normalized_repository}" "$REGISTRY_CREDENTIAL_PROVIDER" "$digest" "$archive_sha" "${{ github.event.workflow_run.id }}" > artifacts/release-manifest.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Package the versioned Helm chart
        if: steps.publish.outputs.is_release == 'true'
        run: helm package helm/realtime-gateway --destination artifacts
      - name: Publish the Helm chart in the public GitHub release
        if: steps.publish.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.publish.outputs.release_version }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="${RELEASE_VERSION}"
          chart="artifacts/realtime-gateway-${RELEASE_VERSION}.tgz"
          notes="docs/release-notes/${RELEASE_VERSION}.md"
          test -f "$chart"
          test -f "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            test "$target" = "$SOURCE_SHA"
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep --fixed-strings --line-regexp --quiet "$(basename "$chart")"; then
              gh release upload "$tag" "$chart"
            fi
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep --fixed-strings --line-regexp --quiet release-manifest.json; then
              gh release upload "$tag" artifacts/release-manifest.json
            fi
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = 'true' ]; then
              if [[ "$RELEASE_VERSION" == *-* ]]; then
                gh release edit "$tag" --draft=false --prerelease
              else
                gh release edit "$tag" --draft=false --latest
              fi
            fi
          else
            release_flags=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" "$chart" artifacts/release-manifest.json \
              --target "$SOURCE_SHA" \
              --title "Cormier Realtime ${RELEASE_VERSION}" \
              --notes-file "$notes" \
              "${release_flags[@]}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: |
            artifacts/release-manifest.json
            artifacts/realtime-gateway-*.tgz
          if-no-files-found: error
