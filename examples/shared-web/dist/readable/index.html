<!doctype html>
<!--! Cormier.Realtime reference assets | MIT -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cormier.Realtime reference application</title>
  <link rel="stylesheet" href="/app.css" integrity="sha384-z466FB2fyJDVP/f10Hj6g64MlPJtn4lLfaiw23VqIRapq78UNw880NpfgNB8Rgy4" crossorigin="anonymous">
</head>
<body>
  <main>
    <h1>Cormier.Realtime full circle</h1>
    <p id="diagnostics">Loading application details…</p>
    <section>
      <h2>Session</h2>
      <label>Tenant <input id="tenant" value="tenant-a" autocomplete="off"></label>
      <label>User <input id="user" value="user-a" autocomplete="off"></label>
      <button id="login">Log in</button><button id="logout">Log out</button>
    </section>
    <section>
      <h2>Realtime</h2>
      <p>State: <strong id="state">idle</strong></p>
      <label>Route <input id="route" value="topics/orders"></label>
      <label>Payload <input id="payload" value='{"message":"hello"}'></label>
      <button id="connect">Connect</button><button id="disconnect">Disconnect</button>
      <button id="subscribe">Subscribe</button><button id="unsubscribe">Unsubscribe</button>
      <button id="publish">Publish</button>
    </section>
    <section><h2>Events and diagnostics</h2><pre id="events" aria-live="polite"></pre></section>
    <div id="stack-links"></div>
  </main>
  <script src="/_content/Cormier.Realtime.Browser/cormier-realtime.iife.js" integrity="sha384-u2igby9pQFej32mUUSV60EzIikQYpdb4XDo2F/bD43CxS9qsdsZqZb1guaCY2rmj" crossorigin="anonymous"></script>
  <script src="/app.js" integrity="sha384-dHmYeShxKhIf1MU/VoAvzZXzc44ot7i2/cvIDrCMckH4L6ngsmkH7BmpeYX+no/L" crossorigin="anonymous"></script>
</body>
</html>
