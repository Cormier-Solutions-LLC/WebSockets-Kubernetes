gateway:
  allowedOrigins:
    - https://propago.local
  shutdownDrainSeconds: 25

networkPolicy:
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: traefik
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/name: traefik

ingressRoute:
  enabled: true
  host: realtime.propago.local
  path: /realtime/ws
  tlsSecretName: realtime-propago-local-tls
