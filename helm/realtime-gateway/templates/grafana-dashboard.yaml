{{- if .Values.observability.grafanaDashboard.enabled }}
{{- $traefikServicePattern := default (printf ".*%s.*" (include "realtime-gateway.fullname" .)) .Values.observability.platformMetrics.traefikServicePattern }}
{{- $dashboardIdentity := printf "%s/%s" .Release.Namespace (include "realtime-gateway.fullname" .) }}
{{- $dashboardUid := printf "realtime-%s" (sha256sum $dashboardIdentity | trunc 31) }}
{{- $dashboardTitle := printf "Realtime Gateway (%s) Production Diagnostics" $dashboardIdentity }}
{{- $certificateName := default (include "realtime-gateway.fullname" .) .Values.observability.platformMetrics.certificateName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "realtime-gateway.fullname" . }}-dashboard
  labels:
    {{- include "realtime-gateway.labels" . | nindent 4 }}
    {{ .Values.observability.grafanaDashboard.label }}: {{ .Values.observability.grafanaDashboard.labelValue | quote }}
data:
  realtime-gateway.json: |-
{{ .Files.Get "dashboards/realtime-gateway.json" | replace "__LOGS_URL__" .Values.observability.links.logsUrl | replace "__TRACES_URL__" .Values.observability.links.tracesUrl | replace "__KUBERNETES_URL__" .Values.observability.links.kubernetesUrl | replace "__RUNBOOK_URL__" .Values.observability.links.runbookBaseUrl | replace "__SERVICE_NAME__" (include "realtime-gateway.fullname" .) | replace "__TRAEFIK_NAMESPACE__" .Values.observability.platformMetrics.traefikNamespace | replace "__TRAEFIK_SERVICE_PATTERN__" $traefikServicePattern | replace "__CERTIFICATE_NAME__" $certificateName | replace "__DASHBOARD_UID__" $dashboardUid | replace "__DASHBOARD_TITLE__" $dashboardTitle | indent 4 }}
{{- end }}
