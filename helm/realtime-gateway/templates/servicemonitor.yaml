{{- if and .Values.metrics.enabled .Values.observability.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "realtime-gateway.fullname" . }}
  labels:
    {{- include "realtime-gateway.labels" . | nindent 4 }}
    {{- with .Values.observability.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "realtime-gateway.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
      {{- if .Values.metrics.authorizationPolicy }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.diagnostics.operatorTokenSecret.name }}
          key: {{ .Values.diagnostics.operatorTokenSecret.key }}
      {{- end }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - targetLabel: environment
          replacement: {{ .Values.observability.environment | quote }}
        - targetLabel: cluster
          replacement: {{ .Values.observability.cluster | quote }}
{{- end }}
