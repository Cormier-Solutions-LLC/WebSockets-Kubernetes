    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build the gateway fixture
        run: |
          dotnet restore examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Test the locked Ktor reference adapter
        working-directory: examples/kotlin-ktor
        run: ./gradlew --no-daemon test buildFatJar
      - name: Build the Ktor reference container
        run: docker build --file examples/kotlin-ktor/Dockerfile --tag cormier-kotlin-ktor:${{ github.sha }} .
      - name: Install Chromium
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        run: npx playwright test --config playwright.kotlin-ktor.config.mjs
      - name: Upload Ktor failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ktor-${{ github.sha }}
          path: artifacts/kotlin-ktor

  rust-axum:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build the gateway fixture
        run: |
          dotnet restore examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Check the locked Axum reference adapter
        working-directory: examples/rust-axum
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the Axum reference container
        run: docker build --file examples/rust-axum/Dockerfile --tag cormier-rust-axum:${{ github.sha }} .
      - name: Install Chromium
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        run: npx playwright test --config playwright.rust-axum.config.mjs
      - name: Upload Axum failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-axum-${{ github.sha }}
          path: artifacts/rust-axum

  go-gin:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: examples/go-gin/go.sum
      - name: Build the gateway fixture
        run: |
          dotnet restore examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Check the locked Gin reference adapter
        working-directory: examples/go-gin
        run: |
          test -z "$(gofmt -l *.go)"
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
      - name: Build the Gin reference container
        run: docker build --file examples/go-gin/Dockerfile --tag cormier-go-gin:${{ github.sha }} .
      - name: Install Chromium
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        run: npx playwright test --config playwright.go-gin.config.mjs
      - name: Upload Gin failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-gin-${{ github.sha }}
          path: artifacts/go-gin

  elixir-phoenix:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.0.6
      - name: Build the gateway fixture
        run: |
          dotnet restore examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Check the locked Phoenix reference adapter
        working-directory: examples/elixir-phoenix
        run: |
          mix deps.get --check-locked
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --no-start
          mix hex.audit
      - name: Build the Phoenix reference container
        run: docker build --file examples/elixir-phoenix/Dockerfile --tag cormier-elixir-phoenix:${{ github.sha }} .
      - name: Install Chromium
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        run: npx playwright test --config playwright.elixir-phoenix.config.mjs
      - name: Upload Phoenix failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: elixir-phoenix-${{ github.sha }}
          path: artifacts/elixir-phoenix

  full-circle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]
        profile: [non-ha, ha]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Bootstrap through Bash
        if: matrix.shell == 'bash'
        run: bash ./scripts/full-circle.sh bootstrap --profile "${{ matrix.profile }}"
      - name: Bootstrap through PowerShell
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/FullCircle.ps1 -Action bootstrap -Profile '${{ matrix.profile }}'
      - name: Install Chromium
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium
      - name: Validate through Bash
        if: matrix.shell == 'bash'
        run: bash ./scripts/full-circle.sh validate --profile "${{ matrix.profile }}"
      - name: Validate through PowerShell
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/FullCircle.ps1 -Action validate -Profile '${{ matrix.profile }}'
      - name: Upload full-circle failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-circle-${{ matrix.shell }}-${{ matrix.profile }}-${{ github.sha }}
          path: artifacts/full-circle
      - name: Clean full-circle fixtures through Bash
        if: always() && matrix.shell == 'bash'
        run: bash ./scripts/full-circle.sh cleanup --profile "${{ matrix.profile }}"
      - name: Clean full-circle fixtures through PowerShell
        if: always() && matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/FullCircle.ps1 -Action cleanup -Profile '${{ matrix.profile }}'
