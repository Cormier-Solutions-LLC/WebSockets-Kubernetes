    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: examples/java-spring-boot/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build the gateway fixture
        run: |
          dotnet restore examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Verify the Spring Boot reference adapter
        working-directory: examples/java-spring-boot
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build the Spring Boot reference container
        run: docker build --file examples/java-spring-boot/Dockerfile --tag cormier-java-spring:${{ github.sha }} .
      - name: Install Chromium
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        run: npx playwright test --config playwright.java-spring-boot.config.mjs
      - name: Upload Spring Boot failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-spring-boot-${{ github.sha }}
          path: artifacts/java-spring-boot

  kotlin-ktor:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
