name: Realtime gateway CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-test-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev
      - name: Restore locked dependencies
        run: dotnet restore Propago.Realtime.sln --runtime linux-x64 --locked-mode
      - name: Build
        run: dotnet build Propago.Realtime.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Propago.Realtime.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Native AOT publish
        run: dotnet publish src/Propago.Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore --output artifacts/native
      - name: Smoke-test Native AOT executable
        env:
          ASPNETCORE_URLS: http://127.0.0.1:8080
          Gateway__ShutdownDrainSeconds: '1'
        run: |
          artifacts/native/Propago.Realtime.Gateway > artifacts/native-smoke.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat artifacts/native-smoke.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/health/startup >/dev/null
          curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:8080/metrics | grep --quiet propago_realtime_health_requests_total
      - name: Create OCI archive with .NET SDK
        run: dotnet publish src/Propago.Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore /t:PublishContainer /p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/propago-realtime-gateway.tar.gz
      - name: Smoke-test rootless read-only OCI image
        id: container-smoke
        run: |
          load_output=$(docker load --input artifacts/propago-realtime-gateway.tar.gz)
          printf '%s\n' "$load_output"
          image_ref=$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image: //p' | tail -n 1)
          if [ -z "$image_ref" ]; then
            echo "Unable to determine the loaded OCI image reference."
            exit 1
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          configured_user=$(docker image inspect --format '{{.Config.User}}' "$image_ref")
          test "$configured_user" = "1654"

          container_name="propago-realtime-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --user 1654:1654 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18080:8080 \
            "$image_ref"

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container_name"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/health/startup >/dev/null
          curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:18080/metrics | grep --quiet propago_realtime_health_requests_total
      - name: Scan source and artifacts
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: artifacts/trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Scan deployable OCI archive
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: artifacts/propago-realtime-gateway.tar.gz
          format: sarif
          output: artifacts/trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          skip-setup-trivy: true
      - name: Upload filesystem scan results
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-filesystem.sarif
          category: trivy-filesystem
      - name: Upload image scan results
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-image.sarif
          category: trivy-image
      - name: Generate SBOM
        if: ${{ always() && steps.container-smoke.outputs.image_ref != '' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.container-smoke.outputs.image_ref }}
          artifact-name: propago-realtime-gateway-sbom.spdx.json
          output-file: artifacts/propago-realtime-gateway.spdx.json
          format: spdx-json
      - name: Upload immutable build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propago-realtime-${{ github.sha }}
          path: |
            artifacts/native
            artifacts/propago-realtime-gateway.tar.gz
            artifacts/test-results
            artifacts/trivy-filesystem.sarif
            artifacts/trivy-image.sarif
            artifacts/native-smoke.log
            artifacts/propago-realtime-gateway.spdx.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
