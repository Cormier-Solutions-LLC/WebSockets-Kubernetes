<!doctype html>
<!--! Cormier.Realtime reference assets | MIT -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cormier.Realtime reference application</title>
  <link rel="stylesheet" href="/app.css" integrity="sha384-pDRoPtvYYvDMWwWx3Nf8D63VasDAnBOmf0T5FGHkoFU9l9qNrilr2nmDZfu6sS6E" crossorigin="anonymous">
</head>
<body>
  <main>
    <h1>Cormier.Realtime full circle</h1>
    <nav><a href="/">WebSocket</a> · <a href="/fallback.html">HTTP streaming only</a> · <a href="/failover.html">WebSocket failover</a></nav>
    <p id="diagnostics">Loading application details…</p>
    <section id="transport-controls" hidden>
      <h2>Failover controls</h2>
      <label><input id="disable-websocket" type="checkbox"> Disable WebSockets to force HTTP failover</label>
    </section>
    <section>
      <h2>Session</h2>
      <label>Tenant <input id="tenant" value="tenant-a" autocomplete="off"></label>
      <label>User <input id="user" value="user-a" autocomplete="off"></label>
      <button id="login">Log in</button><button id="logout">Log out</button>
    </section>
    <section>
      <h2>Realtime</h2>
      <p>State: <strong id="state">idle</strong></p>
      <p>Active transport: <strong id="transport">none</strong></p>
      <label>Route <input id="route" value="topics/orders"></label>
      <label>Payload <input id="payload" value='{"message":"hello"}'></label>
      <button id="connect">Connect</button><button id="disconnect">Disconnect</button>
      <button id="subscribe">Subscribe</button><button id="unsubscribe">Unsubscribe</button>
      <button id="publish">Publish</button>
    </section>
    <section><h2>Events and diagnostics</h2><pre id="events" aria-live="polite"></pre></section>
    <div id="stack-links"></div>
  </main>
  <dialog id="message-modal" aria-labelledby="message-title">
    <h2 id="message-title">Subscription message</h2>
    <p>Route: <strong id="message-route"></strong></p>
    <pre id="message-payload"></pre>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <script src="/_content/Cormier.Realtime.Browser/cormier-realtime.iife.js" integrity="sha384-V5bLHjwFcllU4l84Dqbweiy5d9m5J3w6T487oo0ie7H66wpBBqysxGAjbYc5O69a" crossorigin="anonymous"></script>
  <script src="/app.js" integrity="sha384-/I2KveMUGVks6tQwdUTKhSf9ngizXZpJ5O4IZ9h5Ml1ySd9zCdIY9utLKgdmPjE9" crossorigin="anonymous"></script>
</body>
</html>
