{{- if and .Values.observability.alertmanagerConfig.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1alpha1/AlertmanagerConfig") }}
{{- $secretName := required "observability.alertmanagerConfig.webhookSecret.name is required when routing is enabled" .Values.observability.alertmanagerConfig.webhookSecret.name }}
{{- $serviceLabel := default (include "realtime-gateway.fullname" .) .Values.observability.prometheusRule.routingLabels.service }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ include "realtime-gateway.fullname" . }}
  labels:
    {{- include "realtime-gateway.labels" . | nindent 4 }}
spec:
  route:
    receiver: {{ .Values.observability.alertmanagerConfig.receiverName | quote }}
    matchers:
      - name: service
        value: {{ $serviceLabel | quote }}
      - name: namespace
        value: {{ .Release.Namespace | quote }}
      - name: environment
        value: {{ .Values.observability.environment | quote }}
  receivers:
    - name: {{ .Values.observability.alertmanagerConfig.receiverName | quote }}
      webhookConfigs:
        - urlSecret:
            name: {{ $secretName | quote }}
            key: {{ .Values.observability.alertmanagerConfig.webhookSecret.key | quote }}
          sendResolved: true
{{- end }}
