name: cormier-realtime-full-circle

services:
  redis:
    image: ${FULL_CIRCLE_REDIS_IMAGE:-redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf}
    ports:
      - "127.0.0.1:${FULL_CIRCLE_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped
