name: Realtime gateway CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  DOTNET_INSTALL_DIR: ${{ vars.CI_DOTNET_INSTALL_DIR || '/home/runner/.dotnet' }}
  CI_POWERSHELL_VERSION: ${{ vars.CI_POWERSHELL_VERSION || '7.6.6' }}
  CI_POWERSHELL_LINUX_X64_SHA256: ${{ vars.CI_POWERSHELL_LINUX_X64_SHA256 || 'ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc' }}
  CI_REDIS_IMAGE: ${{ vars.CI_REDIS_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf' }}
  CI_REDIS_BIND_ADDRESS: ${{ vars.CI_REDIS_BIND_ADDRESS || '0.0.0.0' }}
  CI_COMPOSER_IMAGE: ${{ vars.CI_COMPOSER_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/composer:2.10.3@sha256:d8f6343d3fae98107426bc49163ccad46ef85aabd4a27d80a74401fab4aba332' }}
  CI_PYTHON_IMAGE: ${{ vars.CI_PYTHON_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/python:3.14.7-alpine3.24@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc' }}
  CI_RUBY_IMAGE: ${{ vars.CI_RUBY_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/ruby:4.0.6-alpine3.24@sha256:6ec7aeb4f3f0b67a21fb73a83fc20a4055696e64b933229f68ec805a3de38fcc' }}
  CI_SWIFT_IMAGE: ${{ vars.CI_SWIFT_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/swift:6.3.3-noble@sha256:dd115b20969a2acf74c8dcf6da7c4aeda086053c27453dad59052a65bafc8d0c' }}
  CI_POWERSHELL_IMAGE: ${{ vars.CI_POWERSHELL_IMAGE || 'harbor.cormierconsulting.io/mcr/powershell@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81' }}
  CI_PROMETHEUS_IMAGE: ${{ vars.CI_PROMETHEUS_IMAGE || 'harbor.cormierconsulting.io/dockerhub/prom/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038' }}
  CI_HELM_IMAGE: ${{ vars.CI_HELM_IMAGE || 'harbor.cormierconsulting.io/dockerhub/alpine/helm@sha256:af08f75a3130d666a50b9fc150f40987ef20b885cf67659aabf4b83a5f2c5501' }}
  CI_NODE_IMAGE: ${{ vars.CI_NODE_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/node:24.20.0-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf' }}
  CI_MAVEN_IMAGE: ${{ vars.CI_MAVEN_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/maven:3.9.12-eclipse-temurin-25-alpine@sha256:91fbbf32cc5076b6142ed98405f3a1a21e102d876eafa5eaf359b5591e8e3fd8' }}
  CI_JAVA_IMAGE: ${{ vars.CI_JAVA_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/eclipse-temurin:25-jre-alpine@sha256:3137541deb3cac6626b5d9a4a2187bc0d6a34312f858bd2c67dd01e732e6b682' }}
  CI_GRADLE_IMAGE: ${{ vars.CI_GRADLE_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/gradle:9.7.1-jdk25-alpine@sha256:a0991f96020bb532564c947a4bbea93d67befd3cc81b3e356eb1a85556701b6e' }}
  CI_RUST_IMAGE: ${{ vars.CI_RUST_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/rust:1.98.1-alpine@sha256:1716b3aa042d735f4566d14dc54e8037de9d69556e2d5dd58131d93a613d173d' }}
  CI_ALPINE_IMAGE: ${{ vars.CI_ALPINE_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b' }}
  CI_GO_IMAGE: ${{ vars.CI_GO_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/golang:1.27.1-alpine@sha256:cf6fca6641884b8433441b2b0652976f975e1d0fdd26d177eaaf8596087f3125' }}
  CI_GO_CADDY_IMAGE: ${{ vars.CI_GO_CADDY_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/golang:1.26.7-alpine3.24@sha256:28d89ee9cc0ff9fec75c82ca201e6bf7fdf9a679d4b7b24dfa04f2bb766bb468' }}
  CI_ELIXIR_IMAGE: ${{ vars.CI_ELIXIR_IMAGE || 'harbor.cormierconsulting.io/dockerhub/hexpm/elixir:1.20.4-erlang-29.0.6-alpine-3.24.1@sha256:fec752d2a79fc50dc0a29b4da3c62f0a4925bc318f5391e5e221d01f98be6f22' }}
  CI_FRANKENPHP_BUILDER_IMAGE: ${{ vars.CI_FRANKENPHP_BUILDER_IMAGE || 'harbor.cormierconsulting.io/dockerhub/dunglas/frankenphp:1.12.7-builder-php8.5-alpine@sha256:862bce4c7efe77337d8f8170a262b639e1787141ffe70ae0edd9ec6ef96c6a99' }}
  CI_FRANKENPHP_IMAGE: ${{ vars.CI_FRANKENPHP_IMAGE || 'harbor.cormierconsulting.io/dockerhub/dunglas/frankenphp:1.12.7-php8.5-alpine@sha256:214b541fe30aeed2717d54f74149b71b2bdb0089718f1fbb8b43bc170ab00939' }}
  CI_UV_IMAGE: ${{ vars.CI_UV_IMAGE || 'harbor.cormierconsulting.io/ghcr/astral-sh/uv:0.12.13@sha256:b485bd65cc2cf1c9a93b3554012c9c3778cf7b1b5fd3d3096ce9e1226c97e1e6' }}
  CI_SWIFT_RUNTIME_IMAGE: ${{ vars.CI_SWIFT_RUNTIME_IMAGE || 'harbor.cormierconsulting.io/dockerhub/library/swift:6.3.3-noble-slim@sha256:d20e340aeaf7109919b2a15c95569470070cca4d34dae40dfa58339a2aa734df' }}

jobs:
  helm-and-automation:
    runs-on: cormier-runners
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: harbor.cormierconsulting.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Parse PowerShell lifecycle scripts
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint pwsh-preview "$CI_POWERSHELL_IMAGE" -NoLogo -NoProfile -Command '
            $failed = $false
            Get-ChildItem /work/scripts -Filter "*.ps1" | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) { $errors | Format-List; $failed = $true }
            }
            if ($failed) { exit 1 }
          '
      - name: Helm lint, schema, and render validation
        run: |
          jq --exit-status '.templating.list | map(.name) == ["environment","cluster","namespace","instance","pod"]' helm/realtime-gateway/dashboards/realtime-gateway.json
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" lint helm/realtime-gateway --strict
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime > /tmp/external.yaml
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime --values cluster/redis/managed-gateway-values.example.yaml > /tmp/managed.yaml
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime --api-versions monitoring.coreos.com/v1/ServiceMonitor --api-versions monitoring.coreos.com/v1/PrometheusRule --api-versions monitoring.coreos.com/v1alpha1/AlertmanagerConfig --set observability.alertmanagerConfig.enabled=true --set observability.alertmanagerConfig.webhookSecret.name=ci-alert-webhook --set autoscaling.connectionsMetric.enabled=true --set autoscaling.queueDepthMetric.enabled=true --set metrics.authorizationPolicy=ci-metrics --set metrics.scrapeTokenSecret.name=ci-metrics > /tmp/observability.yaml
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime --set diagnostics.enabled=true --set diagnostics.productionEnabled=true --set diagnostics.authorizationPolicy=ci-operator --set diagnostics.operatorTokenSecret.name=ci-diagnostics --set 'diagnostics.allowedNetworks[0]=192.0.2.0/24' --set observability.otlp.enabled=true --set observability.otlp.endpoint=https://otel.example --set 'observability.otlp.egressCidrs[0]=192.0.2.0/24' --set observability.otlp.headersSecret.name=ci-otel > /tmp/diagnostics.yaml
          grep --quiet 'kind: Deployment' /tmp/external.yaml
          grep --quiet 'kind: NetworkPolicy' /tmp/managed.yaml
          grep --quiet 'kind: ServiceMonitor' /tmp/observability.yaml
          grep --quiet 'Metrics__ScrapeToken' /tmp/observability.yaml
          grep --quiet 'name: ci-metrics' /tmp/observability.yaml
          grep --quiet 'kind: PrometheusRule' /tmp/observability.yaml
          grep --quiet 'kind: AlertmanagerConfig' /tmp/observability.yaml
          grep --quiet 'cormier_realtime_active_connections' /tmp/observability.yaml
          grep --quiet 'Diagnostics__ProductionEnabled: "true"' /tmp/diagnostics.yaml
          grep --quiet 'Diagnostics__OperatorToken' /tmp/diagnostics.yaml
          grep --quiet 'name: ci-diagnostics' /tmp/diagnostics.yaml
          grep --quiet 'OTEL_EXPORTER_OTLP_HEADERS' /tmp/diagnostics.yaml
          grep --quiet 'secretKeyRef' /tmp/diagnostics.yaml
          jq --exit-status '.contractVersion and (.metrics | length > 20) and ([.metrics[].labels[]] | all(. != "tenant_id" and . != "user_id" and . != "session_id"))' observability/metrics-catalog.json
          mkdir -p artifacts/helm
          awk '/kind: PrometheusRule/{found=1} found && /^spec:/{in_spec=1;next} in_spec && /^---/{exit} in_spec {sub(/^  /,"");print}' /tmp/observability.yaml > artifacts/helm/prometheus-rules.yaml
          docker run --rm -v "$PWD:/work" -w /work --entrypoint promtool "$CI_PROMETHEUS_IMAGE" check rules artifacts/helm/prometheus-rules.yaml
      - name: Render pinned managed Redis topology
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime-redis oci://registry-1.docker.io/bitnamicharts/redis --version 23.1.1 --namespace ci-realtime --values cluster/redis/managed-values.yaml --set fullnameOverride=ci-realtime-redis --set auth.existingSecret=ci-realtime-redis > /tmp/redis.yaml
          grep --quiet 'kind: StatefulSet' /tmp/redis.yaml
          grep --quiet 'kind: PodDisruptionBudget' /tmp/redis.yaml
          grep --quiet 'kind: NetworkPolicy' /tmp/redis.yaml

  build-test-aot:
    runs-on: cormier-runners
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: harbor.cormierconsulting.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Start configured Redis fixture
        run: bash scripts/start-ci-redis.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install pinned PowerShell
        run: bash scripts/setup-ci-powershell.sh
      - name: Restore TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev
      - name: Restore locked dependencies
        run: dotnet restore Cormier.Realtime.sln --runtime linux-x64 --locked-mode
      - name: Build
        run: dotnet build Cormier.Realtime.sln --configuration Release --no-restore
      - name: Validate clean ASP.NET Core package consumer
        shell: pwsh
        env:
          NUGET_UPSTREAM_SOURCE: https://api.nuget.org/v3/index.json
        run: ./scripts/Test-AspNetCorePackage.ps1
      - name: Validate clean .NET client package consumers
        shell: pwsh
        env:
          NUGET_UPSTREAM_SOURCE: https://api.nuget.org/v3/index.json
        run: ./scripts/Test-DotNetClientPackage.ps1
      - name: Validate clean browser package consumer
        shell: pwsh
        env:
          NUGET_UPSTREAM_SOURCE: https://api.nuget.org/v3/index.json
        run: ./scripts/Test-BrowserPackage.ps1
      - name: Test
        env:
          REDIS_TEST_ENDPOINT: localhost:6379
        run: dotnet test Cormier.Realtime.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Verify OTLP and Prometheus ingestion
        run: bash scripts/verify-observability.sh
      - name: Validate TypeScript SDK and reproducible browser artifacts
        working-directory: sdk/typescript
        run: |
          npm run check
          git diff --exit-code -- dist ../../examples/shared-web/dist
          npm pack --dry-run
      - name: Install browser test engines
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser SDK and live gateway tests
        working-directory: sdk/typescript
        env:
          REDIS_TEST_ENDPOINT: localhost:6379
        run: npm run test:browser
      - name: Native AOT publish
        run: dotnet publish src/Cormier.Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore --output artifacts/native
      - name: Smoke-test Native AOT executable
        env:
          ASPNETCORE_URLS: http://127.0.0.1:8080
          Gateway__ShutdownDrainSeconds: '1'
          Redis__Endpoint: localhost:6379
          Realtime__AllowedOrigins__0: http://127.0.0.1:8080
        run: |
          artifacts/native/Cormier.Realtime.Gateway > artifacts/native-smoke.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat artifacts/native-smoke.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/health/startup >/dev/null
          curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:8080/metrics | grep --quiet cormier_realtime_health_requests_total
          curl --fail --silent http://127.0.0.1:8080/metrics | docker run --rm --interactive --entrypoint promtool "$CI_PROMETHEUS_IMAGE" check metrics
          curl --fail --silent --header 'Accept: application/openmetrics-text; version=1.0.0' http://127.0.0.1:8080/metrics | tee /tmp/openmetrics.txt | docker run --rm --interactive --entrypoint promtool "$CI_PROMETHEUS_IMAGE" check metrics
          tail --lines 1 /tmp/openmetrics.txt | grep --quiet '^# EOF$'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/diagnostics/v1/snapshot)" = "404"
      - name: Create OCI archive with .NET SDK
        run: dotnet publish src/Cormier.Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore /t:PublishContainer /p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/cormier-realtime-gateway.tar.gz
      - name: Smoke-test rootless read-only OCI image
        id: container-smoke
        run: |
          load_output=$(docker load --input artifacts/cormier-realtime-gateway.tar.gz)
          printf '%s\n' "$load_output"
          image_ref=$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image: //p' | tail -n 1)
          if [ -z "$image_ref" ]; then
            echo "Unable to determine the loaded OCI image reference."
            exit 1
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          configured_user=$(docker image inspect --format '{{.Config.User}}' "$image_ref")
          test "$configured_user" = "1654"

          container_name="cormier-realtime-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --user 1654:1654 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --add-host host.docker.internal:host-gateway \
            --env Redis__Endpoint=host.docker.internal:6379 \
            --env Realtime__AllowedOrigins__0=http://127.0.0.1:18080 \
            --publish 127.0.0.1:18080:8080 \
            "$image_ref"

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container_name"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/health/startup >/dev/null
          curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:18080/metrics | grep --quiet cormier_realtime_health_requests_total
      - name: Scan source and artifacts
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: artifacts/trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Scan deployable OCI archive
        if: ${{ always() && hashFiles('artifacts/cormier-realtime-gateway.tar.gz') != '' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: artifacts/cormier-realtime-gateway.tar.gz
          format: sarif
          output: artifacts/trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Upload filesystem scan results
        if: ${{ always() && hashFiles('artifacts/trivy-filesystem.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-filesystem.sarif
          category: trivy-filesystem
      - name: Upload image scan results
        if: ${{ always() && hashFiles('artifacts/trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-image.sarif
          category: trivy-image
      - name: Generate SBOM
        if: ${{ always() && steps.container-smoke.outputs.image_ref != '' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.container-smoke.outputs.image_ref }}
          artifact-name: cormier-realtime-gateway-sbom.spdx.json
          output-file: artifacts/cormier-realtime-gateway.spdx.json
          format: spdx-json
      - name: Upload immutable build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cormier-realtime-${{ github.sha }}
          path: |
            artifacts/native
            artifacts/cormier-realtime-gateway.tar.gz
            artifacts/test-results
            artifacts/trivy-filesystem.sarif
            artifacts/trivy-image.sarif
            artifacts/native-smoke.log
            artifacts/cormier-realtime-gateway.spdx.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: cormier-runners
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  node-express:
    runs-on: cormier-runners
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: harbor.cormierconsulting.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Start configured Redis fixture
        run: bash scripts/start-ci-redis.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            examples/node-express/package-lock.json
            sdk/typescript/package-lock.json
      - name: Build the gateway fixture
        run: |
          dotnet restore examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Cormier.Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Install locked Node.js dependencies
        working-directory: examples/node-express
        run: npm ci --ignore-scripts
      - name: Check the Express reference adapter
        working-directory: examples/node-express
        run: npm run check
      - name: Build the Express reference container
        run: >-
          docker build --build-arg NODE_IMAGE="$CI_NODE_IMAGE"
          --file examples/node-express/Dockerfile --tag cormier-node-express:${{ github.sha }} .
      - name: Scan the Express reference container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: cormier-node-express:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Install Chromium
        working-directory: sdk/typescript
        run: npx playwright install --with-deps chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        run: npx playwright test --config playwright.node-express.config.mjs
      - name: Upload Express failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-express-${{ github.sha }}
          path: artifacts/node-express

  java-spring-boot:
    runs-on: cormier-runners
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: harbor.cormierconsulting.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Start configured Redis fixture
        run: bash scripts/start-ci-redis.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
