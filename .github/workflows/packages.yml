name: Package candidate and promotion

on:
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - 'Directory.Build.*'
      - 'Cormier.Realtime.sln'
      - 'src/**'
      - 'sdk/typescript/**'
      - 'scripts/*Package*.ps1'
      - 'docs/package-release.md'
  workflow_run:
    workflows: [Realtime gateway CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified candidate after environment approval
        required: true
        type: boolean
        default: false
      publish_npm:
        description: Publish the optional npm artifact after registry ownership approval
        required: true
        type: boolean
        default: false
      resume_run_id:
        description: Prior failed package workflow run containing partial-promotion evidence
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_INSTALL_DIR: ${{ vars.CI_DOTNET_INSTALL_DIR || '/home/runner/.dotnet' }}
  NPM_VERSION: 12.1.0
  CI_POWERSHELL_VERSION: ${{ vars.CI_POWERSHELL_VERSION || '7.6.6' }}
  CI_POWERSHELL_LINUX_X64_SHA256: ${{ vars.CI_POWERSHELL_LINUX_X64_SHA256 || 'ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc' }}

jobs:
  release-intent:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: cormier-runners
    outputs:
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      publish_npm: ${{ steps.release.outputs.publish_npm }}
      release_version: ${{ steps.release.outputs.release_version }}
      resume_run_id: ${{ steps.release.outputs.resume_run_id }}
      should_build: ${{ steps.release.outputs.should_build }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Check out trusted release automation
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Check out pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Check out trusted manual commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: refs/heads/main
      - name: Install pinned PowerShell
        run: bash scripts/setup-ci-powershell.sh
      - name: Select coordinated package release
        id: release
        shell: pwsh
        env:
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_PUBLISH_NPM: ${{ inputs.publish_npm }}
          DISPATCH_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $candidateSha = if ($env:EVENT_NAME -eq 'workflow_run') { $env:WORKFLOW_HEAD_SHA } else { $env:EVENT_SHA }
          if ($candidateSha -notmatch '^[a-f0-9]{40}$') {
            throw 'The selected package candidate commit is invalid.'
          }
          $intent = & ./scripts/Get-PackageReleaseIntent.ps1
          $shouldBuild = $env:EVENT_NAME -ne 'workflow_run'
          $dispatchPublishRequested = $env:EVENT_NAME -eq 'workflow_dispatch' -and $env:DISPATCH_PUBLISH -eq 'true'
          if ($dispatchPublishRequested -and $env:EVENT_REF -ne 'refs/heads/main') {
            throw 'Manual package publication is restricted to the main branch.'
          }
          $shouldPublish = $dispatchPublishRequested
          $publishNpm = $shouldPublish -and $env:DISPATCH_PUBLISH_NPM -eq 'true'
          $resumeRunId = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:DISPATCH_RESUME_RUN_ID } else { '' }

          if ($env:EVENT_NAME -eq 'workflow_run') {
            if ($env:WORKFLOW_CONCLUSION -eq 'success' -and
                $env:WORKFLOW_EVENT -eq 'push' -and
                $env:WORKFLOW_HEAD_BRANCH -eq 'main') {
              $parent = (& git rev-parse "$candidateSha^").Trim()
              if ($LASTEXITCODE -ne 0 -or $parent -notmatch '^[a-f0-9]{40}$') {
                throw 'Unable to resolve the first parent of the successful main-branch CI commit.'
              }
              $intent = & ./scripts/Get-PackageReleaseIntent.ps1 -CurrentRevision $candidateSha -PreviousRevision $parent
              $shouldBuild = $intent.VersionChanged
              $shouldPublish = $shouldBuild
              $publishNpm = $false
            }
          }

          "candidate_sha=$candidateSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "publish_npm=$($publishNpm.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "release_version=$($intent.Version)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "resume_run_id=$resumeRunId" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "should_publish=$($shouldPublish.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "### Package release intent" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- Candidate: ``$candidateSha``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- Version: ``$($intent.Version)``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- Build: ``$shouldBuild``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- Publish NuGet: ``$shouldPublish``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  package-candidate:
    if: needs['release-intent'].outputs.should_build == 'true'
    needs: release-intent
    runs-on: cormier-runners
    outputs:
      candidate_artifact_name: ${{ steps.artifact_names.outputs.candidate_artifact }}
    permissions:
      actions: read
      contents: read
      security-events: write
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs['release-intent'].outputs.candidate_sha }}
      - name: Install pinned PowerShell
        run: bash scripts/setup-ci-powershell.sh
      - name: Select attempt-specific artifact names
        id: artifact_names
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs['release-intent'].outputs.candidate_sha }}
        run: '"candidate_artifact=cormier-realtime-packages-$env:CANDIDATE_SHA-${{ github.run_attempt }}" | Add-Content -LiteralPath $env:GITHUB_OUTPUT'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install pinned npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Build and verify immutable package candidate
        shell: pwsh
        env:
          NUGET_UPSTREAM_SOURCE: https://api.nuget.org/v3/index.json
          REDIS_TEST_ENDPOINT: localhost:6379
          PACKAGE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PACKAGE_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          PACKAGE_RELEASE_NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: ./scripts/Build-RealtimePackages.ps1
      - name: Upload package build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cormier-realtime-package-build-${{ needs['release-intent'].outputs.candidate_sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          path: |
            artifacts/package-test-results
            .logs/package-build-*.log
      - name: Scan package candidate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: artifacts/packages
          format: sarif
          output: artifacts/package-scan.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Generate package SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: artifacts/packages
          artifact-name: cormier-realtime-packages-sbom-${{ needs['release-intent'].outputs.candidate_sha }}-${{ github.run_attempt }}.spdx.json
          output-file: artifacts/packages.spdx.json
          format: spdx-json
      - name: Upload package scan
        if: ${{ always() && hashFiles('artifacts/package-scan.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/package-scan.sarif
          category: package-candidate
      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_names.outputs.candidate_artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/packages
            artifacts/package-test-results
            artifacts/package-scan.sarif
            artifacts/packages.spdx.json

  publish-candidate:
    if: needs['release-intent'].outputs.should_publish == 'true'
    needs: [release-intent, package-candidate]
    runs-on: cormier-runners
    environment: package-production
    concurrency:
      group: package-promotion-${{ github.repository }}-${{ needs['release-intent'].outputs.candidate_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs['release-intent'].outputs.candidate_sha }}
      - name: Install pinned PowerShell
        run: bash scripts/setup-ci-powershell.sh
      - name: Validate trusted release commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs['release-intent'].outputs.candidate_sha }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$env:EXPECTED_SHA&status=completed"
          $runs = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -ErrorAction Stop
          $trusted = @($runs.workflow_runs | Where-Object {
            $_.event -eq 'push' -and
            $_.head_branch -eq 'main' -and
            $_.head_sha -eq $env:EXPECTED_SHA -and
            $_.conclusion -eq 'success'
          })
          if ($trusted.Count -eq 0) {
            throw 'Publication requires successful main-branch CI for the exact candidate commit.'
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux' && needs['release-intent'].outputs.publish_npm == 'true'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v4
        if: needs['release-intent'].outputs.publish_npm == 'true'
        with:
          node-version: 26.10.0
          registry-url: ${{ vars.NPM_REGISTRY }}
      - name: Install pinned npm
        if: needs['release-intent'].outputs.publish_npm == 'true'
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Select resumable promotion evidence
        id: resume
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs['release-intent'].outputs.candidate_sha }}
          REQUESTED_RUN_ID: ${{ needs['release-intent'].outputs.resume_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_CANDIDATE_ARTIFACT: ${{ needs['package-candidate'].outputs.candidate_artifact_name }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $candidatePrefix = "cormier-realtime-packages-$env:EXPECTED_SHA-"
          if ($env:CURRENT_CANDIDATE_ARTIFACT -notmatch ('^' + [regex]::Escape($candidatePrefix) + '([1-9][0-9]*)$')) {
            throw 'The package-candidate job did not expose a valid attempt-specific artifact name.'
          }
          $currentCandidateAttempt = [int]$Matches[1]
          $evidenceRunId = $null
          if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_RUN_ID)) {
            if ($env:REQUESTED_RUN_ID -notmatch '^[1-9][0-9]*$') {
              throw 'resume_run_id must be a GitHub Actions run ID.'
            }
            $priorUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REQUESTED_RUN_ID"
            $prior = Invoke-RestMethod -Method Get -Uri $priorUri -Headers $headers -ErrorAction Stop
            if ($prior.path -ne '.github/workflows/packages.yml' -or
                $prior.event -notin @('workflow_dispatch', 'workflow_run') -or
                $prior.status -ne 'completed' -or
                $prior.head_sha -ne $env:EXPECTED_SHA) {
              throw 'The selected resume run is not a completed package workflow for this exact commit.'
            }
            $evidenceRunId = $env:REQUESTED_RUN_ID
          }
          elseif ([int]$env:CURRENT_RUN_ATTEMPT -gt 1) {
            $evidenceRunId = $env:CURRENT_RUN_ID
          }
          if ($null -eq $evidenceRunId) {
            'has_state=false' | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            "candidate_attempt=$currentCandidateAttempt" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            exit 0
          }
          $artifactsUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$evidenceRunId/artifacts?per_page=100"
          $artifacts = Invoke-RestMethod -Method Get -Uri $artifactsUri -Headers $headers -ErrorAction Stop
          $prefix = "cormier-realtime-package-promotion-$env:EXPECTED_SHA-"
          $pattern = '^' + [regex]::Escape($prefix) + 'c([1-9][0-9]*)-r([1-9][0-9]*)$'
          $matches = @($artifacts.artifacts | ForEach-Object {
            if (-not $_.expired -and $_.name -match $pattern) {
              [pscustomobject]@{
                artifact = $_
                candidateAttempt = [int]$Matches[1]
                evidenceAttempt = [int]$Matches[2]
              }
            }
          } | Sort-Object evidenceAttempt -Descending)
          if ($matches.Count -eq 0) {
            if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_RUN_ID)) {
              throw 'The selected resume run has no retained promotion state for this commit.'
            }
            'has_state=false' | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            "candidate_attempt=$currentCandidateAttempt" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            exit 0
          }
          $selected = $matches[0]
          'has_state=true' | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "run_id=$evidenceRunId" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "evidence_artifact=$($selected.artifact.name)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "candidate_attempt=$($selected.candidateAttempt)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "candidate_artifact=cormier-realtime-packages-$env:EXPECTED_SHA-$($selected.candidateAttempt)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Download current immutable candidate
        if: steps.resume.outputs.has_state != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs['package-candidate'].outputs.candidate_artifact_name }}
          path: artifacts
      - name: Download original resumable candidate
        if: steps.resume.outputs.has_state == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resume.outputs.candidate_artifact }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.resume.outputs.run_id }}
      - name: Attest exact immutable package candidate
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/packages/**/*.nupkg
            artifacts/packages/**/*.snupkg
            artifacts/packages/**/*.tgz
      - name: Validate publication inputs
        shell: pwsh
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          PROTECTED_NUGET_SOURCE: ${{ vars.NUGET_SOURCE }}
          INPUT_PUBLISH_NPM: ${{ needs['release-intent'].outputs.publish_npm }}
          PROTECTED_NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'The package-production environment must define the NuGet.org profile name in NUGET_USER.'
          }
          if ($env:PROTECTED_NUGET_SOURCE -notmatch '^https://') {
            throw 'The package-production environment must define an HTTPS NUGET_SOURCE variable.'
          }
          if ($env:INPUT_PUBLISH_NPM -eq 'true' -and $env:PROTECTED_NPM_REGISTRY -notmatch '^https://') {
            throw 'The package-production environment must define an HTTPS NPM_REGISTRY variable when npm publication is enabled.'
          }
      - name: Download prior promotion evidence
        if: steps.resume.outputs.has_state == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resume.outputs.evidence_artifact }}
          path: resume-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.resume.outputs.run_id }}
      - name: Restore prior promotion state
        if: steps.resume.outputs.has_state == 'true'
        shell: pwsh
        run: |
          $states = @(Get-ChildItem resume-evidence -Filter 'promotion-*.json' -File -Recurse)
          if ($states.Count -ne 1) {
            throw 'The selected resume artifact must contain exactly one promotion state file.'
          }
          New-Item -ItemType Directory -Path artifacts/package-promotion -Force | Out-Null
          Copy-Item -LiteralPath $states[0].FullName -Destination artifacts/package-promotion
      - name: Obtain temporary NuGet credential
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Promote exact candidate
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROTECTED_NUGET_SOURCE: ${{ vars.NUGET_SOURCE }}
          INPUT_PUBLISH_NPM: ${{ needs['release-intent'].outputs.publish_npm }}
          PROTECTED_NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}
        run: |
          $candidate = Get-ChildItem artifacts/packages -Directory | Select-Object -First 1
          if ($null -eq $candidate) { throw 'Downloaded candidate directory was not found.' }
          $parameters = @{
            CandidatePath = $candidate.FullName
            NuGetSource = $env:PROTECTED_NUGET_SOURCE
            Confirm = $false
          }
          if ($env:INPUT_PUBLISH_NPM -eq 'true') {
            $parameters.PublishNpm = $true
            $parameters.NpmRegistry = $env:PROTECTED_NPM_REGISTRY
          }
          & ./scripts/Publish-RealtimePackages.ps1 @parameters
      - name: Upload promotion state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cormier-realtime-package-promotion-${{ needs['release-intent'].outputs.candidate_sha }}-c${{ steps.resume.outputs.candidate_attempt }}-r${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: artifacts/package-promotion
      - name: Upload promotion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cormier-realtime-package-promotion-logs-${{ needs['release-intent'].outputs.candidate_sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          path: .logs/package-publish-*.log
